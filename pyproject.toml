[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "gerador-senha"
version = "0.1.0"
description = "CLI para gerar senhas aleatorias seguras"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["click>=8.1,<9"]

[project.optional-dependencies]
test = ["pytest>=8,<9"]

[project.scripts]
senha-segura = "gerador_senha.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
